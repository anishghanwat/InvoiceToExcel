[pytest]
# Pytest configuration for invoice processing tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    integration: Integration tests that require AWS credentials
    slow: Tests that take a long time to run
    requires_aws: Tests that require AWS credentials
    requires_ai: Tests that require AI/Gemini API key

# Coverage (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term
